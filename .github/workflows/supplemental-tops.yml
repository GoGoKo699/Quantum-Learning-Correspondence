name: Supplemental source introductions
on:
  pull_request:
    paths:
      - '.github/workflows/supplemental-tops.yml'
      - 'verification/capture_supplemental_tops.cjs'
permissions:
  contents: read
jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated read-only capture runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/top-runtime" playwright@1.56.1
          node "$RUNNER_TEMP/top-runtime/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Capture fresh introductions without scroll traversal
        run: |
          export NODE_PATH="$RUNNER_TEMP/top-runtime/node_modules"
          node verification/capture_supplemental_tops.cjs "$RUNNER_TEMP/supplemental-tops"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: supplemental-tops-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/supplemental-tops
          if-no-files-found: error
          retention-days: 14
